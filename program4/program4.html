<html>
<head>
<title>Registration Form</title>
<style>
body
{
background-color:lightblue;
width:700px;
margin:auto;
}
td{
padding:10px;
}
h2{
text-align:center;
}
</style>
</head>
<body>
<h2>Registration form</h2>
<form>
<table>
<tr>
<td>Full Name</td>
<td><input type="text"></td>
</tr>
<tr>
<td>Mobile number</td>
<td><input type="text"></td>
</tr>
<tr>
<td>E-mail id</td>
<td><input type="email"></td>
</tr>
<tr>
<td>Age</td>
<td><input type="text"></td>
</tr>
<tr>
<td>Gender</td>
<td><input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<input type="radio" name="gender">Others
</td>
</tr>
<tr>
<td>Date of birth</td>
<td><textarea rows="8" cols="25"></textarea>
</td>
</tr>
<tr>
<td>Current study</td>
<td><select>
<option>B.tech</option>
<option>M.tech</option>
<option>BCA</option>
<option>MCA</option>
</select>
</td>
</tr>
<tr>
<td>Department</td>
<td><select>
<option>CS</option>
<option>IT</option>
<option>EC</option>
<option>EEE</option>
</select>
</td>
</tr>
<tr>
<td>upload cv</td>
<td><input type="file">
</td>
</tr>
<tr>
<td>Programming Languages</td>
<td>
<input type="checkbox">HTML
<input type="checkbox">Reactjs
<input type="checkbox">CSS
<input type="checkbox">Flutter
</td>
</tr>
<tr>
<td>Languages</td>
<td>
<input type="checkbox">Malayalam
<input type="checkbox">English
<input type="checkbox">hindi
</td>
</tr>

<tr>
<td>
<input type="submit" value="submit">
</td>
<td><input type="reset" value="reset">
</td>
</tr>
</table>
</form>
</body>
<html>
